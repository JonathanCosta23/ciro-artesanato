name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Usar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validar Node.js 24
        run: |
          node --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major !== 24) process.exit(1)"

      - name: Validar JavaScript
        run: |
          node --check server.js
          node --check app.js
          node --check app-core.js
          node --check app-pdf.js
          node --check app-main.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site
        run: |
          mkdir -p _site
          cp index.html style.css app.js app-core.js app-pdf.js app-main.js _site/

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
